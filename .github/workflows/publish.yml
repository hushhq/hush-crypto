name: Publish WASM Package
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        run: wasm-pack build --target web --scope gethush --out-dir pkg/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@gethush'
      - name: Verify WASM binary exists
        run: test -f pkg/hush_crypto_bg.wasm || (echo "WASM binary missing" && exit 1)
      - name: Check version is not already published
        run: |
          PKG_VERSION="$(node -e "console.log(require('./pkg/package.json').version)")"
          echo "Checking whether @gethush/hush-crypto@${PKG_VERSION} is already on npmjs.com..."
          if npm view "@gethush/hush-crypto@${PKG_VERSION}" version 2>/dev/null | grep -qF "${PKG_VERSION}"; then
            echo "ERROR: @gethush/hush-crypto@${PKG_VERSION} is already published."
            echo "Bump the version in Cargo.toml before tagging a new release."
            exit 1
          fi
          echo "@gethush/hush-crypto@${PKG_VERSION} not yet published - proceeding."
      - name: Publish to npmjs.com
        run: npm publish pkg/ --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Release notes come from CHANGELOG.md, not auto-generated commit logs.
      # The tag vX.Y.Z maps to the `## [X.Y.Z]` section; a missing section fails
      # the release so CHANGELOG.md is bumped before every tag. GITHUB_REF_NAME is
      # read from the env (not interpolated) so the tag cannot inject shell.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          section="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {inv=1; next}
            inv && /^## \[/ {exit}
            inv {print}
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::No CHANGELOG.md section for ${version}. Add a '## [${version}]' entry before tagging."
            exit 1
          fi
          {
            echo "body<<__CHANGELOG_EOF__"
            printf '%s\n' "$section"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
